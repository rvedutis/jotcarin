<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskule</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233563e9'/%3E%3Cstop offset='1' stop-color='%237a4fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Pick the colour theme before anything is drawn, so a dark theme never flashes white.
    try {
      var t = JSON.parse(localStorage.getItem('tk:theme') || '"system"');
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* storage unavailable: light */ }
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8.5"/></svg>
        </div>
        <span class="brand-name">Taskule</span>
        <button class="icon-btn sidebar-pin" id="sidebar-pin" type="button" aria-label="Collapse sidebar"></button>
        <button class="icon-btn sidebar-close" id="sidebar-close" title="Close sidebar" aria-label="Close sidebar"></button>
      </div>

      <div class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search notes & tasks" autocomplete="off" spellcheck="false" aria-label="Search notes and tasks">
        <kbd class="search-kbd">/</kbd>
      </div>

      <nav class="nav">
        <button class="nav-item scratch" id="nav-scratch" type="button" title="Scratchpad — quick notes and to-dos to sort later (Alt+S)">
          <span class="nav-icon"></span>
          <span class="nav-label">Scratchpad</span>
          <span class="nav-count" id="scratch-count"></span>
        </button>
      </nav>

      <div class="tree-header">
        <button class="tree-title" id="tree-root" type="button" title="Select top level (new notes go here)">Notes</button>
        <div class="tree-header-actions">
          <button class="icon-btn" id="new-folder" type="button" title="New folder"></button>
          <button class="icon-btn accent-blue" id="new-note" type="button" title="New note (Alt+N)"></button>
        </div>
      </div>
      <div id="tree" role="tree" aria-label="Notes and folders"></div>

      <div class="sidebar-footer">
        <div class="save-status" id="save-status" aria-live="polite"><span class="dot"></span><span class="label">All changes saved</span></div>
        <div class="footer-actions">
          <button class="btn-download" id="download" type="button" title="Download everything as Word, Markdown or PDF — or a database backup"></button>
          <button class="btn-settings" id="settings-btn" type="button" title="Settings" aria-label="Settings"></button>
          <button class="btn-lock" id="lock-now" type="button" title="Lock Taskule (asks for the password again)" aria-label="Lock"></button>
          <button class="btn-wipe" id="wipe" type="button" title="Delete all notes, folders and tasks"></button>
        </div>
      </div>
    </aside>
    <div id="scrim"></div>
    <!-- Collapsed sidebar: hover the left edge or this button to peek; click the button to pin it open. -->
    <div id="sb-edge" aria-hidden="true"></div>
    <button id="sb-handle" class="sb-handle" type="button" title="Show sidebar — click to pin it open (Ctrl+\)" aria-label="Show sidebar"></button>
    <!-- Closed tasks panel: hover this to peek at your tasks, click to keep the panel open. -->
    <button id="tp-handle" class="tp-handle" type="button" title="Tasks — click to keep the panel open (Alt+T)" aria-label="Show tasks"><span class="tp-handle-icon"></span><span class="tp-handle-count" id="tp-handle-count"></span></button>
    <main id="main" tabindex="-1"></main>
    <!-- Tasks panel: every task in one place (standalone ones and to-dos from notes). -->
    <aside id="taskpanel" aria-label="Tasks">
      <div class="tp-head">
        <span class="tp-icon" aria-hidden="true"></span>
        <h2>Tasks</h2>
        <span class="tp-count" id="tp-count"></span>
        <button class="icon-btn" id="tp-pin" type="button" aria-label="Close tasks"></button>
      </div>
      <form class="tp-add" id="add-task-form" autocomplete="off">
        <span class="add-icon" aria-hidden="true"></span>
        <input id="add-task-input" maxlength="2000" placeholder="Add a task" aria-label="New task">
      </form>
      <div class="tp-body" id="tp-body"></div>
    </aside>
    <div id="tp-scrim"></div>
  </div>

  <!-- Due-date picker for tasks -->
  <div id="due-pop" class="due-pop" hidden role="dialog" aria-label="Due date">
    <input id="due-input" autocomplete="off" spellcheck="false" placeholder="Type a date — tomorrow, next fri, 12/1">
    <div class="due-sugg" id="due-sugg" role="listbox"></div>
    <div class="due-row">
      <input type="date" id="due-native" aria-label="Pick a date">
      <button type="button" class="due-clear" id="due-clear">Remove date</button>
    </div>
  </div>

  <div id="outage" hidden role="alertdialog" aria-modal="true" aria-labelledby="outage-title" aria-describedby="outage-text">
    <div class="outage-card">
      <div class="outage-icon" aria-hidden="true"><span class="spin"></span></div>
      <h2 id="outage-title"></h2>
      <p id="outage-text"></p>
      <p class="outage-detail" id="outage-detail"></p>
      <button class="lock-btn outage-retry" id="outage-retry" type="button">Check again now</button>
      <p class="outage-foot">Checking automatically every couple of seconds.</p>
    </div>
  </div>

  <div id="lock" hidden>
    <form class="lock-card" id="lock-form" autocomplete="off">
      <div class="brand-mark lock-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8.5"/></svg></div>
      <h1 class="lock-title">Taskule is locked</h1>
      <p class="lock-sub">Enter your password to open your notes.</p>
      <input id="lock-password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" spellcheck="false" required>
      <input id="lock-confirm" type="password" placeholder="Type it again" aria-label="Confirm password" autocomplete="new-password" spellcheck="false" hidden>
      <p class="lock-error" id="lock-error" role="alert"></p>
      <button class="lock-btn" id="lock-submit" type="submit">Unlock</button>
    </form>
  </div>

  <dialog id="dialog"></dialog>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
